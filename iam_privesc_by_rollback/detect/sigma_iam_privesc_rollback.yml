title: AWS IAM Privilege Escalation via Policy Version Rollback
status: experimental
description: >
  Detects an IAM policy reverted to a prior, more permissive version via
  SetDefaultPolicyVersion - a stealthy privilege escalation that restores old
  permissions without creating a new policy document.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: SetDefaultPolicyVersion
  condition: selection
falsepositives:
  - Administrators intentionally reverting a policy to a previous version
level: high
tags:
  - attack.privilege_escalation
  - attack.t1098
