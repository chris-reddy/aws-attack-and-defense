title: AWS Instance Profile Role Swap for Privilege Escalation
status: experimental
description: >
  Detects modification of an EC2 instance profile's attached role
  (Add/RemoveRoleFromInstanceProfile). Attackers swap a low-privilege role for a
  more privileged one on an instance they control to inherit its permissions.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - AddRoleToInstanceProfile
      - RemoveRoleFromInstanceProfile
  condition: selection
falsepositives:
  - Legitimate reconfiguration of an instance's IAM role by operations or IaC
level: high
tags:
  - attack.privilege_escalation
  - attack.t1098
  - attack.t1078
